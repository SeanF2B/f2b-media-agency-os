name: Outreach CI

# Full production build + every test, for the Outreach branch and PRs into main.
# Read-only: no secrets, no deploy. Failures are surfaced as annotations so they
# can be read from the check-runs API.
on:
  push:
    branches: ["outreach/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outreach-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log
      - name: Outreach tests (gating)
        run: |
          set -o pipefail
          node --test tests/outreach-*.test.mjs 2>&1 | tee /tmp/test.log
      - name: Existing test suite (reported, not gating — has pre-existing failures on main)
        continue-on-error: true
        run: |
          set -o pipefail
          node --test $(ls tests/*.test.mjs | grep -v '/outreach-') 2>&1 | tee /tmp/legacy.log | tail -12
          grep -E "^# (pass|fail)" /tmp/legacy.log | sed 's/^/::notice title=existing suite::/'
      - name: Typecheck (new Outreach files strict; edited files must not add errors vs main)
        run: |
          set -o pipefail
          npx tsc --noEmit -p tsconfig.json > /tmp/tsc-head.log 2>&1 || true
          grep -E "^(lib/outreach|components/outreach|app/api/outreach|app/api/marketing-public/outreach|worker/outreach)" /tmp/tsc-head.log > /tmp/tsc.log || true
          git fetch -q --depth=50 origin main
          git worktree add -q /tmp/base origin/main
          ln -s "$PWD/node_modules" /tmp/base/node_modules
          (cd /tmp/base && npx tsc --noEmit -p tsconfig.json > /tmp/tsc-base.log 2>&1 || true)
          for f in $(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' | grep -vE "^(lib/outreach|components/outreach|app/api/outreach)"); do
            head_n=$(grep -c "^$f(" /tmp/tsc-head.log || true); base_n=$(grep -c "^$f(" /tmp/tsc-base.log || true)
            echo "$f: $base_n errors on main, $head_n on branch"
            if [ "$head_n" -gt "$base_n" ]; then grep "^$f(" /tmp/tsc-head.log >> /tmp/tsc.log; fi
          done
          if [ -s /tmp/tsc.log ]; then cat /tmp/tsc.log; exit 1; fi
      - name: Production build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build.log
      - name: End-to-end (built worker)
        if: hashFiles('tests/e2e/*.mjs') != ''
        run: |
          set -o pipefail
          node --experimental-transform-types --no-warnings --import ./tests/e2e/register.mjs --test tests/e2e/*.test.mjs 2>&1 | tee /tmp/e2e.log
      - name: Report failure details
        if: failure()
        run: |
          for f in /tmp/test.log /tmp/tsc.log /tmp/build.log /tmp/e2e.log /tmp/install.log; do
            [ -s "$f" ] || continue
            grep -nE "not ok|Error|error|ERR|failed|✘|expected|actual" "$f" | tail -40 | while IFS= read -r line; do
              echo "::error title=$(basename $f)::${line:0:900}"
            done
          done
